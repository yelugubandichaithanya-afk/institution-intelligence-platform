<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password · IIP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="auth-page">
  <main class="auth-card auth-card-solo">
    <a class="logo logo-dark" href="login.html">
      <span class="logo-mark">IIP</span>
      <span>Institution Intelligence<small>One Search. One Profile. One Executive View.</small></span>
    </a>
    <h1 class="auth-title">Set a new password</h1>

    <div class="alert" id="alert" role="alert" hidden></div>

    <form id="resetForm" class="auth-form" novalidate>
      <label>New password<input type="password" name="password" autocomplete="new-password" minlength="8" required>
        <span class="hint">At least 8 characters</span></label>
      <label>Confirm new password<input type="password" name="confirm" autocomplete="new-password" required></label>
      <button class="btn btn-block" type="submit">Update password</button>
    </form>
    <div class="auth-links"><a class="text-link" href="login.html">← Back to sign in</a></div>
  </main>

  <script src="js/config.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (() => {
      const form = document.getElementById('resetForm');
      const alertBox = document.getElementById('alert');
      const showAlert = (msg, kind = 'error') => {
        alertBox.textContent = msg;
        alertBox.className = `alert ${kind}`;
        alertBox.hidden = !msg;
      };

      // The email link lands here with #access_token=...&type=recovery
      const hash = new URLSearchParams(location.hash.slice(1));
      const token = hash.get('type') === 'recovery' ? hash.get('access_token') : null;
      history.replaceState(null, '', location.pathname); // keep the token out of history

      if (!token) {
        form.hidden = true;
        showAlert(hash.get('error_description') ||
          'This reset link is invalid or has expired. Request a new one from the sign-in page.');
        return;
      }

      form.addEventListener('submit', async (e) => {
        e.preventDefault();
        const f = new FormData(form);
        if (f.get('password').length < 8) return showAlert('Password must be at least 8 characters.');
        if (f.get('password') !== f.get('confirm')) return showAlert('Passwords do not match.');
        const btn = form.querySelector('button');
        btn.disabled = true;
        btn.textContent = 'Please wait…';
        try {
          await Auth.updatePassword(token, f.get('password'));
          location.replace('login.html?reset=1');
        } catch (err) {
          showAlert(err.message);
          btn.disabled = false;
          btn.textContent = 'Update password';
        }
      });
    })();
  </script>
</body>
</html>
